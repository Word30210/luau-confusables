name = "word30210/luau_confusables"
version = "0.1.0"
authors = ["word30210"]
repository = "https://github.com/Word30210/luau-confusables"
license = "MIT"
includes = ["src/**", "pesde.toml", "LICENSE", "README.md"]
description = "a confusable character checker"

[engines]
pesde = "^0.7.1"
lune = "^0.10.2"

[target]
environment = "luau"
lib = "src/lib.luau"

[dev_dependencies]
darklua = { name = "pesde/darklua", version = "^0.18.0", target = "lune" }
multitarget = { name = "ewdev/multitarget", version = "^0.4.2-rc.7", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.7.0-rc.1", target = "lune" }

[indices]
default = "https://github.com/pesde-pkg/index"

[scripts]
build = "scripts/build"